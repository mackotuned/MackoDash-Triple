<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070708">
<!-- Home-screen app: Share > Add to Home Screen opens this full-screen. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MackoDash">
<meta name="application-name" content="MackoDash">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<title>MackoTuned · MackoDash</title>
<style>
/* MackoTuned / MackoDash control surface — 3 tabs: Air Ride, Climate, Settings.
   Air Ride and Climate fit the screen with no scrolling (portrait, landscape,
   head unit). Compatibility: no flexbox gap, no inset, no aspect-ratio. */
:root{
  --bg:#070708;--panel:#121214;--panel2:#18181b;--line:#26262b;--line2:#34343a;
  --ink:#f4f4f2;--muted:#8b8b93;--dim:#55555c;
  --red:#e4002b;--red2:#ff1f45;--redglow:rgba(228,0,43,.35);
  --acc:#e4002b;--acc-hi:#ff1f45;--acc-lo:#b0001e;--acc-glow:rgba(228,0,43,.35);--acc-tint:rgba(228,0,43,.15);--acc-ink:#fff;
  --warn:#ff1f45;--warn-lo:#8a0019;--warn-line:#5a1020;--tank:#ff1f45;--cold:#3aa0ff;--mid:#7d5cff;--hot:#ff1f45;
  --bgglow:rgba(228,0,43,.14);--tex:rgba(255,255,255,.014);
  --amber:#ffb020;--green:#39ff8c;--blue:#3aa0ff;
  --f-disp:"Roboto Condensed","sans-serif-condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:Roboto,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --top:58px;--bar:80px;--rail:0px;--pad:12px;
  --st:0px;--sb:0px;--sl:0px;--sr:0px;
}
@supports (padding-top:env(safe-area-inset-top)){
  :root{--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;color:var(--ink);font:15px/1.35 var(--f-body);
  background:radial-gradient(ellipse at 0 0,var(--bgglow) 0,transparent 45%),
    repeating-linear-gradient(45deg,var(--tex) 0,var(--tex) 2px,transparent 2px,transparent 5px),var(--bg);
  background-attachment:fixed;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body.locked{overflow:hidden;position:fixed;left:0;right:0;top:0;bottom:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
svg{display:block}

/* ---------- top bar ---------- */
.top{position:fixed;z-index:20;top:0;left:0;right:0;height:calc(var(--top) + var(--st));display:flex;align-items:center;padding:var(--st) calc(14px + var(--sr)) 0 calc(14px + var(--sl));
  background:rgba(7,7,8,.97);border-bottom:1px solid var(--line)}
.top:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:linear-gradient(90deg,var(--acc) 0,var(--acc) 120px,transparent 120px,transparent 128px,var(--acc) 128px,var(--acc) 148px,transparent 148px)}
.mark{display:block;height:38px;width:auto;flex:none}
.tag{margin-left:12px;padding-left:12px;border-left:1px solid var(--line2);font:700 11px/1 var(--f-disp);letter-spacing:.3em;color:var(--muted)}
.top-right{margin-left:auto;display:flex;align-items:center}
.chip{display:none;margin-right:8px;padding:5px 9px;border:1px solid var(--amber);color:var(--amber);border-radius:3px;font:700 10px/1 var(--f-disp);letter-spacing:.14em;transform:skewX(-10deg)}
.chip.on{display:block}
.save{margin-right:10px;font:700 10px/1 var(--f-disp);letter-spacing:.16em;color:var(--muted);opacity:0;transition:opacity .2s}
.save.on{opacity:1}.save.bad{color:var(--warn)}
.link{display:flex;align-items:center;height:32px;padding:0 13px;border:1px solid var(--line2);border-radius:16px;font:700 11px/1 var(--f-disp);letter-spacing:.16em;color:var(--muted);background:#0d0d0f}
.link i{width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.link.live{color:var(--ink);border-color:#1f4d3a}.link.live i{background:var(--green);box-shadow:0 0 10px var(--green)}
.link.offline{color:var(--warn);border-color:var(--warn-line)}.link.offline i{background:var(--warn);box-shadow:0 0 10px var(--warn);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- navigation: 3 big tabs (bottom bar on portrait, rail on landscape) ---------- */
.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;height:calc(var(--bar) + var(--sb));display:flex;
  padding-bottom:var(--sb);background:rgba(10,10,12,.98);border-top:1px solid var(--line)}
.nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);min-width:0}
.nav svg{width:30px;height:30px;margin-bottom:6px}
.nav span{font:800 italic 13px/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase}
.nav button.on{color:var(--ink);background:linear-gradient(180deg,var(--acc-tint),transparent)}
.nav button.on:before{content:"";position:absolute;top:0;left:18%;right:18%;height:3px;background:var(--acc);box-shadow:0 0 14px var(--acc)}
.nav button.on svg{color:var(--acc-hi)}
.main{padding-top:calc(var(--top) + var(--st));padding-bottom:calc(var(--bar) + var(--sb))}
.page{display:none}
.page.on{display:block;animation:rise .2s ease-out}
.page.fit.on{display:flex;flex-direction:column;height:calc(100vh - var(--top) - var(--bar));height:calc(var(--vh,100vh) - var(--top) - var(--st) - var(--bar) - var(--sb));padding:var(--pad);overflow:hidden}
@keyframes rise{from{opacity:0}}

/* ---------- shared panel look ---------- */
.panel{position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;min-width:0;min-height:0;overflow:hidden}
.ptitle{position:absolute;left:14px;top:12px;font:800 italic 12px/1 var(--f-disp);letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.ptitle:before{content:"";display:inline-block;width:12px;height:3px;margin-right:7px;vertical-align:3px;background:var(--acc);transform:skewX(-30deg)}

/* ======================================================================
   AIR RIDE
   ====================================================================== */
.air{flex:1;display:flex;flex-direction:column;min-height:0}
.scr{position:relative;flex:0 0 37%;min-height:0;border-radius:18px;
  background:radial-gradient(ellipse at 50% 0,#17171b 0,#060607 75%);border:1px solid #222227;
  box-shadow:inset 0 2px 16px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.03)}
.scr svg{position:absolute;left:0;top:26px;width:100%;height:calc(100% - 30px)}
.scr-bar{position:absolute;z-index:1;left:14px;right:14px;top:9px;display:flex;font:700 10px/1 var(--f-disp);letter-spacing:.18em;color:var(--dim)}
.scr-bar b{margin-left:auto;color:var(--warn)}.scr-bar b.live{color:var(--green)}
.scr text{font-family:var(--f-disp);font-style:italic;font-weight:800}
.scr .lbl{font-style:normal;font-weight:700;font-size:9px;letter-spacing:2px;fill:#77777f}
.scr .val{font-size:40px;fill:#f4f4f2}
.scr .tankv{font-size:38px;fill:var(--tank)}
.scr .box{fill:rgba(255,255,255,.025);stroke:#2c2c32;stroke-width:1.5}
.scr .hit{cursor:pointer}
.scr .hit.sel .box{stroke:var(--acc);stroke-width:2.5;fill:var(--acc-tint)}
.scr .bar-bg{fill:#232328}.scr .bar-fg{fill:var(--acc)}
.scr .axle{fill:none;stroke:var(--acc-hi);stroke-width:3;stroke-linecap:round;opacity:0}
.scr .axle.on{opacity:1}

.remote{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:12px}
.rm-main{flex:1;display:flex;min-height:0}
.selcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:0}
.axbtn{flex:none;width:72%;max-width:220px;height:44px;border-radius:22px;border:1px solid var(--line2);
  background:linear-gradient(180deg,#232328,#15151a);font:800 italic 13px/1 var(--f-disp);letter-spacing:.2em;color:var(--muted);
  box-shadow:0 2px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.axbtn.on{color:var(--acc-ink);border-color:var(--acc);background:linear-gradient(180deg,var(--acc-hi),var(--acc-lo));box-shadow:0 0 18px var(--acc-glow)}
.wheel{flex:1;width:100%;min-height:0;margin:8px 0}
.wheel .q{fill:url(#qg);stroke:#000;stroke-width:1;cursor:pointer}
.wheel .q.on{fill:url(#qr)}
.wheel .ql{font:800 italic 17px var(--f-disp);fill:#9a9aa3;pointer-events:none;letter-spacing:1px}
.wheel .ql.on{fill:#fff}
.wheel .hub{fill:url(#hub);stroke:#3a3a42;stroke-width:1.5;cursor:pointer}
.wheel .hub.on{fill:url(#qr);stroke:var(--acc-hi)}
.wheel .hl{font:800 italic 20px var(--f-disp);fill:#cfcfd4;pointer-events:none;letter-spacing:2px}
.wheel .hl.on{fill:#fff}
.wheel .ring{fill:none;stroke:#2a2a30;stroke-width:2}

.rocker{flex:0 0 36%;max-width:200px;display:flex;flex-direction:column;margin-left:12px;border-radius:60px;overflow:hidden;
  border:1px solid #3a3a42;background:#0c0c0e;box-shadow:0 8px 24px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.rocker button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;-webkit-touch-callout:none;
  background:linear-gradient(180deg,#26262c,#17171b)}
.rocker button+button{border-top:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.rocker svg{width:46px;height:46px;color:var(--acc-hi)}
.rocker b{margin-top:6px;font:800 italic 16px/1 var(--f-disp);letter-spacing:.16em}
.rocker small{margin-top:4px;font:700 9px/1 var(--f-disp);letter-spacing:.24em;color:var(--muted)}
.rocker button.act{background:linear-gradient(180deg,var(--acc-hi),var(--acc-lo));box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.rocker button.act svg,.rocker button.act b{color:var(--acc-ink)}
.rocker button:disabled{opacity:.28}

.rm-foot{flex:none;display:flex;align-items:center;margin-top:12px}
.comp{flex:1;display:flex;align-items:center;height:54px;padding:0 18px;border-radius:27px;border:1px solid var(--line2);
  background:linear-gradient(180deg,#1e1e23,#121215);text-align:left}
.comp i{width:12px;height:12px;border-radius:50%;margin-right:12px;background:#333;box-shadow:inset 0 1px 2px #000}
.comp b{font:800 italic 15px/1 var(--f-disp);letter-spacing:.14em}
.comp span{margin-left:auto;font:700 11px/1 var(--f-disp);letter-spacing:.18em;color:var(--muted)}
.comp.on{border-color:#1f6b46}.comp.on i{background:var(--green);box-shadow:0 0 12px var(--green)}.comp.on span{color:var(--green)}
.comp.ready i{background:#6b6b73}
.comp:disabled{opacity:.35}
.why{display:none}

/* phone portrait: the whole tab is one machined remote */
@media (orientation:portrait){
  .air{padding:12px;border-radius:38px;border:1px solid #2c2c32;
    background:linear-gradient(165deg,#2a2a30 0,#17171b 38%,#0e0e10 100%);
    box-shadow:0 18px 40px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.09),inset 0 -1px 0 rgba(0,0,0,.8)}
  .air:before{content:"";display:block;flex:none;width:44px;height:4px;margin:0 auto 10px;border-radius:2px;background:#3a3a42}
  .scr{border-radius:24px}
}
/* landscape (head unit, tablet, phone sideways): display left, remote right */
@media (orientation:landscape){
  .air{flex-direction:row}
  .scr{flex:1.15 1 0;border-radius:16px}
  .remote{flex:1 1 0;margin:0 0 0 12px;padding:12px;border-radius:16px;border:1px solid var(--line);
    background:linear-gradient(165deg,#202025,#121214)}
}

/* ======================================================================
   CLIMATE
   ====================================================================== */
.clim{flex:1;display:flex;flex-direction:column;min-height:0}
.c-temp{flex:1 1 46%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px}
.c-fan,.c-mode{flex:none;margin-top:12px;padding:38px 10px 10px}
.cstat{position:absolute;right:12px;top:10px;padding:5px 9px;border-radius:3px;font:800 10px/1 var(--f-disp);letter-spacing:.16em;background:var(--amber);color:#000}
.cstat.live{background:var(--green)}.cstat.off{background:var(--warn);color:#fff}.cstat.chk{background:#444;color:#ddd}
.cnote{position:absolute;left:0;right:0;bottom:10px;text-align:center;font:700 10px/1.3 var(--f-disp);letter-spacing:.14em;color:var(--amber)}
.dialbox{flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;margin-top:20px}
.dial{height:100%;max-height:300px;width:100%;touch-action:none;cursor:pointer}
.dial .track{fill:none;stroke:#1d1d22;stroke-width:22;stroke-linecap:round}
.dial .grad{fill:none;stroke:url(#tg);stroke-width:14;stroke-linecap:round}
.dial .tick{stroke:#3a3a42;stroke-width:2}
.dial .knob{fill:#fff;stroke:#070708;stroke-width:5}
.dial .big{font:800 italic 58px var(--f-disp);fill:#f4f4f2}
.dial .word{font:700 12px var(--f-disp);letter-spacing:4px;fill:#8b8b93}
.tbtns{flex:none;display:flex;width:100%;max-width:360px;margin:6px 0 26px}
.tbtns button{flex:1;height:52px;border-radius:26px;border:1px solid var(--line2);background:linear-gradient(180deg,#232328,#15151a);font:800 italic 15px/1 var(--f-disp);letter-spacing:.16em}
.tbtns button+button{margin-left:12px}
.tbtns .cold{color:var(--cold)}.tbtns .hot{color:var(--hot)}
.bank{display:flex}
.bank button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:64px;border-radius:12px;border:1px solid var(--line2);
  background:linear-gradient(180deg,#1f1f24,#131316);color:var(--muted)}
.bank button+button{margin-left:8px}
.bank b{font:800 italic 20px/1 var(--f-disp)}
.bank small{display:block;margin-top:5px;font:700 9px/1 var(--f-disp);letter-spacing:.12em}
.bank svg{width:30px;height:30px}
.bank button.on{color:var(--acc-ink);border-color:var(--acc);background:linear-gradient(180deg,var(--acc-hi),var(--acc-lo));box-shadow:0 0 16px var(--acc-glow)}
.bank.modes button{height:76px}
.fanico{display:none}
.fanico svg{animation:spin 1s linear infinite;animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
@media (orientation:landscape){
  .clim{flex-direction:row}
  .c-temp{flex:1.25 1 0;order:2;margin:0 12px}
  .c-fan{order:1}.c-mode{order:3}
  .c-fan,.c-mode{flex:1 1 0;margin-top:0;display:flex;flex-direction:column;padding-top:40px}
  .c-fan .bank{flex:1;flex-direction:column-reverse}
  .c-mode .bank{flex:1;flex-direction:column}
  .bank button,.bank.modes button{height:auto;flex:1;flex-direction:row;justify-content:flex-start;padding:0 16px}
  .bank button+button{margin-left:0;margin-bottom:0}
  .c-fan .bank button+button{margin-bottom:8px}
  .c-mode .bank button+button{margin-top:8px}
  .bank small{margin:0 0 0 12px;font-size:12px;letter-spacing:.14em}
  .bank svg{margin-right:2px}
  .c-fan .bank button{justify-content:center}
  .fanico{display:block;position:absolute;right:12px;top:8px;width:24px;height:24px;color:var(--acc-hi)}
}

/* ======================================================================
   SETTINGS (scrolls)
   ====================================================================== */
#settings{padding:0 14px 30px;max-width:1240px;margin:0 auto}
.jump{position:-webkit-sticky;position:sticky;top:calc(var(--top) + var(--st));z-index:10;display:flex;overflow-x:auto;margin:0 -14px 6px;padding:10px 14px;
  background:rgba(7,7,8,.96);border-bottom:1px solid var(--line);scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;height:40px;padding:0 18px;margin-right:8px;border-radius:20px;border:1px solid var(--line2);background:#111114;
  font:800 italic 13px/1 var(--f-disp);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.jump button.on{color:var(--acc-ink);border-color:var(--acc);background:var(--acc)}
.group{padding-top:14px}
.gh{display:flex;align-items:center;margin:14px 0 4px}
.gh h2{margin:0;font:800 italic 26px/1 var(--f-disp);letter-spacing:.04em;text-transform:uppercase}
.gh:after{content:"";flex:1;height:2px;margin-left:14px;background:linear-gradient(90deg,var(--line2),transparent)}
.grid{display:grid;grid-template-columns:1fr;grid-gap:12px;gap:12px}
.sec{margin-top:18px}
.sec-h{display:flex;align-items:center;margin:0 0 10px;font:700 12px/1 var(--f-disp);letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.sec-h:before{content:"";width:14px;height:3px;margin-right:8px;background:var(--acc);transform:skewX(-30deg)}
.card{position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0;overflow:hidden}
.card:before{content:"";position:absolute;top:0;left:16px;width:34px;height:3px;background:var(--acc);transform:skewX(-30deg)}
.card h3{margin:2px 0 6px;font:700 italic 15px/1.1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase}
.card .sub{margin:-2px 0 6px;color:var(--muted);font-size:11px}
.row{display:flex;align-items:center;min-height:62px;padding:8px 0;border-top:1px solid rgba(255,255,255,.05)}
.card h3+.row,.card .sub+.row,.row:first-child{border-top:0}
.row .lab{flex:1;min-width:0;padding-right:12px}
.row .lab b{display:block;font-weight:600;font-size:15px}
.row .lab small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.row.stack{display:block}.row.stack .lab{padding:0 0 8px}
.sw{position:relative;width:62px;height:34px;border-radius:17px;background:#2a2a30;border:1px solid var(--line2);flex:none;transition:background .15s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#d8d8dc;transition:transform .15s}
.sw.on{background:var(--acc);border-color:var(--acc);box-shadow:0 0 14px var(--acc-glow)}
.sw.on:after{transform:translateX(28px);background:#fff}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#0d0d0f;flex:none}
.seg button{min-width:58px;height:48px;padding:0 12px;font:700 13px/1 var(--f-disp);letter-spacing:.1em;color:var(--muted);border-left:1px solid var(--line2);text-transform:uppercase}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.seg.wide{display:flex;width:100%}.seg.wide button{flex:1;min-width:0;padding:0 4px}
.stp{display:flex;align-items:center;flex:none;border:1px solid var(--line2);border-radius:8px;background:#0d0d0f}
.stp button{width:52px;height:52px;font:400 28px/1 var(--f-body)}
.stp button:active{background:var(--acc)}
.stp output{min-width:96px;text-align:center;font:700 italic 22px/52px var(--f-disp);font-variant-numeric:tabular-nums;border-left:1px solid var(--line2);border-right:1px solid var(--line2)}
.stp output small{font-size:12px;color:var(--muted);margin-left:2px;font-style:normal}
.stp.caution output{color:var(--amber)}.stp.critical output{color:var(--warn)}
.sl{display:flex;align-items:center;width:100%}
.sl output{width:64px;text-align:right;font:700 italic 22px/1 var(--f-disp)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;width:100%;height:48px;margin:0 14px 0 0;background:transparent;--fill:50%}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--acc) 0,var(--acc) var(--fill),#2a2a30 var(--fill),#2a2a30 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;margin-top:-12px;border-radius:50%;background:#fff;border:5px solid var(--acc);box-shadow:0 0 0 5px var(--acc-tint)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#2a2a30}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid var(--acc)}
input[type=range]:disabled{opacity:.35}
.selwrap{position:relative;flex:none;min-width:160px}
.selwrap:after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;margin-top:-6px;border-right:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(45deg);pointer-events:none}
select{-webkit-appearance:none;appearance:none;width:100%;height:48px;padding:0 36px 0 12px;border:1px solid var(--line2);border-radius:8px;background:#0d0d0f;font:700 13px/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase}
select option{background:#121214;color:var(--ink)}
.colors{display:flex;flex-wrap:wrap;align-items:center}
.colors button{width:38px;height:38px;margin:0 9px 9px 0;border-radius:50%;border:2px solid rgba(255,255,255,.12)}
.colors button.on{border-color:#fff;box-shadow:0 0 0 3px var(--bg),0 0 0 5px currentColor}
.colors label{position:relative;width:38px;height:38px;margin:0 9px 9px 0;border-radius:50%;border:2px dashed var(--line2);overflow:hidden}
.colors label:after{content:"+";position:absolute;left:0;right:0;top:0;bottom:0;text-align:center;font:300 24px/34px var(--f-body);color:var(--muted);pointer-events:none}
.colors input{position:absolute;left:-10px;top:-10px;width:60px;height:60px;opacity:0;cursor:pointer}
.hex{font:700 12px/1 var(--f-disp);letter-spacing:.1em;color:var(--muted);margin:0 0 8px 2px}
.bright .big{font:800 italic 46px/1 var(--f-disp)}
.bright .big small{font-size:18px;color:var(--muted)}
.bright .sl output{display:none}.bright input[type=range]{margin-right:0}.bright .row .lab{display:none}
.tach{position:relative;height:96px;margin:6px 4px 4px}
.tach .scale{position:absolute;left:0;right:0;top:34px;height:16px;background:#1d1d21;border-radius:2px;overflow:hidden}
.tach .vtec-zone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,176,32,.25),rgba(255,176,32,.08))}
.tach .red-zone{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(-45deg,var(--warn) 0,var(--warn) 6px,var(--warn-lo) 6px,var(--warn-lo) 10px)}
.tach .tick{position:absolute;top:52px;width:1px;height:10px;background:var(--line2)}
.tach .tick span{position:absolute;top:13px;left:-10px;width:20px;text-align:center;font:700 italic 12px/1 var(--f-disp);color:var(--muted)}
.tach .vt{position:absolute;top:2px;margin-left:-22px;width:44px;text-align:center;font:900 italic 14px/1 var(--f-disp);color:var(--warn)}
.tach .vt:after{content:"";display:block;width:2px;height:20px;margin:4px auto 0;background:var(--amber)}
.tach .st{position:absolute;top:36px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid #000;box-shadow:0 0 8px currentColor}
.tach .rl{position:absolute;top:84px;margin-left:-30px;width:60px;text-align:center;font:700 10px/1 var(--f-disp);letter-spacing:.14em;color:var(--warn)}
.wbar{position:relative;height:10px;margin:4px 0 10px;border-radius:5px;background:#1f3a2c;overflow:hidden}
.wbar i{position:absolute;top:0;bottom:0}
.wbar .c{background:var(--amber)}.wbar .x{background:var(--warn)}
.wscale{display:flex;justify-content:space-between;margin-top:-6px;margin-bottom:6px;font:700 italic 11px/1 var(--f-disp);color:var(--dim)}
.wdir{display:inline-block;margin-left:8px;padding:2px 6px;border-radius:3px;background:#202024;color:var(--muted);font:700 9px/1.3 var(--f-disp);letter-spacing:.12em;font-style:normal;vertical-align:2px}
.btn{display:inline-block;height:50px;padding:0 20px;border:1px solid var(--line2);border-radius:8px;background:#0d0d0f;font:700 13px/50px var(--f-disp);letter-spacing:.14em;text-transform:uppercase}
.btn.red{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.ghost-red{border-color:var(--warn-line);color:var(--warn)}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid rgba(255,255,255,.05);font-size:13px}
.kv:first-of-type{border-top:0}.kv span{color:var(--muted)}
.kv b{font:700 italic 15px/1 var(--f-disp)}
@media (min-width:760px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:1fr 1fr 1fr}}

/* ---------- misc ---------- */
.toast{position:fixed;z-index:50;left:50%;bottom:calc(var(--bar) + var(--sb) + 18px);max-width:90%;padding:12px 18px;border-radius:6px;background:#f4f4f2;color:#111;
  font:700 12px/1.2 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;transform:translate(-50%,16px);opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.bad{background:var(--warn);color:#fff}
.modal{position:fixed;z-index:60;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72)}
.modal.on{display:flex}
.modal .card{width:340px;max-width:90%;padding:20px}
.modal .acts{display:flex;justify-content:flex-end;margin-top:18px}
.modal .acts .btn{margin-left:8px}

/* landscape: left rail */
@media (orientation:landscape){
  :root{--bar:0px;--rail:112px}
  .nav{top:calc(var(--top) + var(--st));bottom:0;right:auto;width:calc(var(--rail) + var(--sl));height:auto;flex-direction:column;padding:8px 0 var(--sb) var(--sl);border-top:0;border-right:1px solid var(--line)}
  .nav button{max-height:170px}
  .nav button.on{background:linear-gradient(90deg,var(--acc-tint),transparent)}
  .nav button.on:before{top:18%;bottom:18%;left:0;right:auto;width:3px;height:auto}
  .main{margin-left:calc(var(--rail) + var(--sl))}
  .page.fit.on{padding-right:calc(var(--pad) + var(--sr))}
  .toast{bottom:22px;margin-left:calc(var(--rail) / 2)}
}
/* short landscape (phone sideways) */
@media (orientation:landscape) and (max-height:500px){
  :root{--top:46px;--rail:92px;--pad:8px}
  .mark{height:30px}
  .nav svg{width:26px;height:26px}.nav span{font-size:11px}
  .scr-bar{top:7px}
  .remote{padding:8px}
  .axbtn{height:34px}
  .wheel{margin:4px 0}
  .rm-foot{margin-top:8px}.comp{height:44px}
  .rocker svg{width:34px;height:34px}.rocker b{font-size:14px}
  .tbtns{margin:2px 0 8px}.tbtns button{height:42px}
  .dial .big{font-size:52px}
  .c-fan,.c-mode{padding-top:34px}
  .cnote{display:none}
}
@media (max-width:420px){
  .tag{display:none}
  .stp output{min-width:80px;font-size:20px}.stp button{width:46px}
  .seg button{min-width:46px;padding:0 8px}
}

/* ---------- SVG colours follow the theme ---------- */
.carhl{stroke:var(--acc);stroke-width:4;stroke-linecap:round}
.tankbox{fill:rgba(6,6,7,.94);stroke:var(--warn-line);stroke-width:1.5}
.s-hi{stop-color:var(--acc-hi)}.s-lo{stop-color:var(--acc-lo)}
.s-cold{stop-color:var(--cold)}.s-mid{stop-color:var(--mid)}.s-hot{stop-color:var(--hot)}
.dial .big.cold{fill:var(--cold)}.dial .big.hot{fill:var(--hot)}

/* ---------- theme picker ---------- */
.themes{display:grid;grid-template-columns:1fr 1fr;grid-gap:12px;gap:12px;margin:6px 0 4px}
.tcard{position:relative;display:block;width:100%;padding:0 0 12px;border-radius:12px;border:2px solid var(--line2);background:#0d0d0f;text-align:left;overflow:hidden}
.tcard.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-tint)}
.tcard svg{width:100%;height:150px;display:block;margin-top:8px}
.tcard b{display:block;margin:10px 14px 0;font:800 italic 17px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase}
.tcard small{display:block;margin:4px 14px 0;color:var(--muted);font-size:11px}
.tcard .tick{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--acc-ink);
  font:700 16px/26px var(--f-body);text-align:center;opacity:0}
.tcard.on .tick{opacity:1}

/* ======================================================================
   GRAPHITE theme — matches the Graphite dashboard: flat graphite face,
   ice-blue accent, coral warning, upright DIN-style lettering.
   ====================================================================== */
html.graphite{
  --bg:#090a0c;--panel:#14171b;--panel2:#1a1e23;--line:#262a30;--line2:#363c44;
  --ink:#eef0f2;--muted:#868d97;--dim:#5a616b;
  --acc:#5ec8f2;--acc-hi:#7fd5f6;--acc-lo:#2f9fcc;--acc-glow:rgba(94,200,242,.3);--acc-tint:rgba(94,200,242,.13);--acc-ink:#0c0e11;
  --warn:#ff564a;--warn-lo:#7a2a24;--warn-line:#3a2a2c;--tank:#eef0f2;--cold:#5ec8f2;--mid:#9aa3ad;--hot:#ff564a;
  --amber:#5ec8f2;--green:#61d6a3;--blue:#5ec8f2;
  --bgglow:rgba(94,200,242,.05);--tex:transparent;
  --f-disp:Bahnschrift,"DIN Alternate","DIN Next LT Pro",Barlow,Roboto,"Segoe UI",Arial,sans-serif;
}
html.graphite *{font-style:normal!important}
html.graphite .card:before,html.graphite .sec-h:before,html.graphite .ptitle:before{transform:none;border-radius:2px}
html.graphite .chip{transform:none}
html.graphite .top:after{background:linear-gradient(90deg,var(--acc) 0,var(--acc) 120px,transparent 220px)}
html.graphite .scr .val,html.graphite .scr .tankv,html.graphite .dial .big,html.graphite .bright .big,
html.graphite .stp output,html.graphite .readout strong{font-weight:300}
html.graphite .scr{background:radial-gradient(ellipse at 50% 0,#171a1f 0,#08090b 75%);border-color:#22262c}
html.graphite .scr .box{fill:rgba(255,255,255,.02);stroke:#2a2f36}
html.graphite .scr .tankv{font-size:42px}
html.graphite .tankbox{fill:rgba(9,10,12,.95);stroke:#2f353d}
html.graphite .scr .bar-bg{fill:#22262c}
html.graphite .rocker button,html.graphite .axbtn,html.graphite .comp,html.graphite .tbtns button,html.graphite .bank button{background:linear-gradient(180deg,#1d2126,#14171b)}
html.graphite .rocker{border-color:#363c44;background:#0b0c0e}
html.graphite .rocker button.act,html.graphite .bank button.on,html.graphite .axbtn.on{background:var(--acc);box-shadow:0 0 18px var(--acc-glow)}
html.graphite .rocker button.act b,html.graphite .rocker button.act small{color:var(--acc-ink)}
html.graphite .bank button.on small,html.graphite .bank button.on b{color:var(--acc-ink)}
html.graphite .dial .track{stroke:#1c2025}
html.graphite .dial .knob{stroke:#090a0c}
html.graphite .wheel .ql.on,html.graphite .wheel .hl.on{fill:var(--acc-ink)}
html.graphite .remote{background:linear-gradient(165deg,#1b1f24,#121418)}
@media (orientation:portrait){
  html.graphite .air{background:linear-gradient(165deg,#252a31 0,#171a1f 38%,#0e1013 100%);border-color:#2c3239}
}
</style>

<script>
'use strict';
/* MackoDash control UI.
   Targets old Android WebViews (car head units): ES2017 syntax only — no
   optional chaining, nullish coalescing, object spread or optional catch
   binding. Everything is inline; the ESP has no Internet. */

if (!Element.prototype.replaceChildren) {
  Element.prototype.replaceChildren = function () {
    while (this.firstChild) this.removeChild(this.firstChild);
    for (var i = 0; i < arguments.length; i++) this.appendChild(arguments[i]);
  };
}

// ======================================================================
// Small helpers
// ======================================================================
function $(id) { return document.getElementById(id); }
function h(tag, attrs, kids) {
  var el = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
  }
  if (kids != null) {
    (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
      if (c == null || c === false) return;
      el.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
    });
  }
  return el;
}
function getPath(obj, key) {
  return key.split('.').reduce(function (v, p) { return v == null ? undefined : v[p]; }, obj);
}
function setPath(obj, key, value) {
  var parts = key.split('.'), o = obj;
  for (var i = 0; i < parts.length - 1; i++) { if (o == null) return; o = o[parts[i]]; }
  if (o != null) o[parts[parts.length - 1]] = value;
}
function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
function hex(n) { return '#' + ('000000' + (Number(n) >>> 0).toString(16)).slice(-6); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

var toastTimer;
function toast(text, bad) {
  var el = $('toast');
  el.textContent = text;
  el.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.className = 'toast' + (bad ? ' bad' : ''); }, bad ? 2600 : 1600);
}
function confirmBox(title, text, yes) {
  $('modalTitle').textContent = title;
  $('modalText').textContent = text;
  $('modal').className = 'modal on';
  $('modalYes').onclick = function () { $('modal').className = 'modal'; yes(); };
  $('modalNo').onclick = function () { $('modal').className = 'modal'; };
}

// One press/hold abstraction for Pointer Events with touch + mouse fallback.
var HAS_POINTER = !!window.PointerEvent;
function onPress(el, down, up) {
  var active = false;
  function start(e) {
    if (active || el.disabled) return;
    if (e.button != null && e.button > 0) return;
    active = true;
    if (e.cancelable) e.preventDefault();
    if (HAS_POINTER && e.pointerId != null) { try { if (el.setPointerCapture) el.setPointerCapture(e.pointerId); } catch (err) {} }
    down(e);
  }
  function end() { if (!active) return; active = false; up(); }
  if (HAS_POINTER) {
    el.addEventListener('pointerdown', start);
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (t) { el.addEventListener(t, end); });
  } else {
    el.addEventListener('touchstart', start, { passive: false });
    ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(function (t) { el.addEventListener(t, end); });
    el.addEventListener('mousedown', start);
  }
  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  return end;
}
function repeatPress(el, fn) {
  var t1, t2;
  onPress(el, function () {
    fn();
    t1 = setTimeout(function () { t2 = setInterval(fn, 70); }, 380);
  }, function () { clearTimeout(t1); clearInterval(t2); });
}

// ======================================================================
// Network: timeouts, link health, serial settings saves
// ======================================================================
var S = { settings: null, air: null, page: 'display' };
var net = { ok: 0, fail: 0, streak: 0 };

function fetchWithTimeout(url, options, ms) {
  if (typeof AbortController === 'undefined') return fetch(url, options);
  var ctl = new AbortController();
  var timer = setTimeout(function () { ctl.abort(); }, ms);
  options.signal = ctl.signal;
  return fetch(url, options).then(function (r) { clearTimeout(timer); return r; },
    function (e) { clearTimeout(timer); throw e; });
}
function setLink(state) {
  var el = $('link');
  el.className = 'link ' + state;
  el.lastChild.textContent = state === 'live' ? 'LIVE' : state === 'offline' ? 'OFFLINE' : 'CONNECTING';
}
// Resolves to {ok, status, json, unavailable}; never rejects.
// "unavailable" = endpoint not in this firmware (404 or captive-portal redirect).
function request(method, url, body, ms, extra) {
  var opts = { method: method, cache: 'no-store', headers: {} };
  if (extra && extra.manualRedirect) opts.redirect = 'manual';
  if (body != null) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  return fetchWithTimeout(url, opts, ms || 2500).then(function (res) {
    net.ok++; net.streak = 0; setLink('live');
    var redirected = res.type === 'opaqueredirect' || res.redirected;
    return res.text().then(function (text) {
      var json = null;
      try { json = text ? JSON.parse(text) : null; } catch (e) { json = null; }
      return { ok: res.ok && !redirected, status: res.status, json: json, text: text,
               unavailable: redirected || res.status === 404 || res.status === 501 };
    });
  }, function () {
    net.fail++; net.streak++;
    if (net.streak >= 2) setLink('offline');
    return { ok: false, status: 0, json: null, text: '', unavailable: false };
  });
}

// Settings saves: per-key coalescing, one request at a time, server is authoritative.
var pending = {}, pendingOrder = [], saving = false, saveTimer = null, busyKeys = {};
function setLocal(key, value) { if (S.settings) setPath(S.settings, key, value); }
function queueSave(key, value) {
  if (!S.settings) return;
  setLocal(key, value);
  busyKeys[key] = Date.now() + 1500;
  if (!(key in pending)) pendingOrder.push(key);
  pending[key] = value;
  saveBadge('SAVING', false);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSaves, 260);
  refreshDerived();
}
function flushSaves() {
  if (saving || !pendingOrder.length) return;
  var key = pendingOrder.shift(), value = pending[key];
  delete pending[key];
  saving = true;
  request('POST', '/api/settings', { key: key, value: value }, 3500).then(function (r) {
    saving = false;
    if (r.ok && r.json) {
      S.settings = r.json;

      stepper('airRide.compressorOnPsi', 'Turn on below', { min: 80, max: 195, step: 1 }, 'psi tank'),
      stepper('airRide.compressorOffPsi', 'Turn off at', { min: 85, max: 200, step: 1 }, 'psi · at least 5 above on')
    ]),
    card('Presets', [0, 1, 2, 3, 4, 5].map(function (i) {
      return stepper('airRide.presetPsi.' + i, 'P' + (i + 1), { min: 0, max: 200, step: 1, suffix: ' psi' });
    }), 'Stored targets — not applied automatically yet')
  ]));
}
function buildSystem(p) {
  var channels = ['RPM', 'Speed', 'Boost', 'Coolant', 'Intake', 'AFR', 'Oil pressure', 'Fuel pressure', 'Battery', 'Throttle', 'Fuel level'];
  p.appendChild(h('div', { class: 'grid c2' }, [
    card('Vehicle source', [segmented('canProtocol', 'CAN protocol', ['Automatic', 'Hondata'], null, true)]),
    card('Logging', [toggle('logging.autoRecord', 'Auto record', 'Start a microSD log automatically'),
      segmented('logging.logName', 'Log profile', ['General', 'Dyno', 'Tune', 'Race', 'Test'], null, true)])
  ]));
  p.appendChild(section('Display roles', h('div', { class: 'grid c2' }, [
    card('Left · CAN data', [
      select('screenLayout.leftValueChannels.0', 'Main value', channels),
      select('screenLayout.leftValueChannels.1', 'Lower left', channels),
      select('screenLayout.leftValueChannels.2', 'Lower right', channels)]),
    card('Right · Air Ride', [toggle('screenLayout.rightBatteryEnabled', 'Show CAN battery')])
  ])));
  var info = {};
  ['Settings revision', 'Schema version', 'Requests OK', 'Requests failed'].forEach(function (k) { info[k] = h('b', { text: '--' }); });
  derived.push(function () {
    info['Settings revision'].textContent = S.settings ? S.settings.revision : '--';
    info['Schema version'].textContent = S.settings ? S.settings.schemaVersion : '--';
  });
  setInterval(function () { info['Requests OK'].textContent = net.ok; info['Requests failed'].textContent = net.fail; }, 1000);
  var reset = h('button', { class: 'btn ghost-red', text: 'Restore defaults' });
  reset.addEventListener('click', function () {
    confirmBox('Restore defaults?', 'Every MackoDash setting returns to factory values. This cannot be undone.', function () {
      request('POST', '/api/reset', null, 4000).then(function (r) {
        if (r.ok && r.json) { S.settings = r.json; syncAll(); toast('Defaults restored'); }
        else toast('Reset failed', true);
      });
    });
  });
  p.appendChild(section('Maintenance', h('div', { class: 'grid c2' }, [
    card('Status', Object.keys(info).map(function (k) { return h('div', { class: 'kv' }, [h('span', { text: k }), info[k]]); })),
    card('Reset', [h('div', { class: 'sub', text: 'Restores all display, engine, warning and Air Ride settings.' }), reset])
  ])));
}
var GROUPS = [['display', 'Display', buildDisplay], ['engine', 'Engine', buildEngine], ['warnings', 'Warnings', buildWarnings],
              ['airset', 'Air Ride', buildAirSetup], ['system', 'System', buildSystem]];
function buildSettings(p) {
  var jump = h('div', { class: 'jump' });
  var chips = {}, groups = {};
  GROUPS.forEach(function (g) {
    var chip = h('button', { text: g[1] });
    chip.addEventListener('click', function () {
      var top = groups[g[0]].getBoundingClientRect().top + window.pageYOffset - jump.offsetHeight - document.querySelector('.top').offsetHeight + 2;
      window.scrollTo(0, Math.max(0, top));
    });
    jump.appendChild(chip); chips[g[0]] = chip;
  });
  p.appendChild(jump);
  GROUPS.forEach(function (g) {
    var box = h('div', { class: 'group' }, h('div', { class: 'gh' }, h('h2', { text: g[1] })));
    g[2](box);
    p.appendChild(box); groups[g[0]] = box;
  });
  function spy() {
    if (S.page !== 'settings') return;
    var cur = GROUPS[0][0];
    GROUPS.forEach(function (g) { if (groups[g[0]].getBoundingClientRect().top < 170) cur = g[0]; });
    Object.keys(chips).forEach(function (k) { chips[k].className = k === cur ? 'on' : ''; });
  }
  window.addEventListener('scroll', spy);
  setTimeout(spy, 0);
}

// ======================================================================
// Shell & navigation
// ======================================================================
var PAGES = [['air', 'Air Ride', buildAir, true], ['climate', 'Climate', buildClimate, true], ['settings', 'Settings', buildSettings, false]];
var NAV_ICON = { air: I.air, climate: I.climate, settings: I.system };
var pageEls = {}, navEls = {};
function go(id) {
  if (!pageEls[id]) id = 'air';
  holdStop();
  S.page = id;
  PAGES.forEach(function (pg) {
    pageEls[pg[0]].className = 'page' + (pg[3] ? ' fit' : '') + (pg[0] === id ? ' on' : '');
    navEls[pg[0]].className = pg[0] === id ? 'on' : '';
  });
  document.body.className = id === 'settings' ? '' : 'locked';
  store('mdPage', id);
  window.scrollTo(0, 0);
  if (id === 'air') airLoop();
  if (id === 'climate') { if (C.status !== 'live') C.status = 'checking'; renderClimate(); climatePoll(); }
  else clearTimeout(C.timer);
}
function fitViewport() { document.documentElement.style.setProperty('--vh', window.innerHeight + 'px'); }
function init() {
  applyTheme(store('mdTheme') === '1' ? 1 : 0);
  fitViewport();
  window.addEventListener('resize', fitViewport);
  window.addEventListener('orientationchange', function () { setTimeout(fitViewport, 250); });
  var nav = $('nav'), main = $('main');
  PAGES.forEach(function (pg) {
    var b = h('button', { html: NAV_ICON[pg[0]] }, h('span', { text: pg[1] }));
    b.addEventListener('click', function () { go(pg[0]); });
    nav.appendChild(b); navEls[pg[0]] = b;
    var sec = h('section', { class: 'page', id: pg[0] });
    pg[2](sec);
    main.appendChild(sec); pageEls[pg[0]] = sec;
  });
  derived.push(function () {
    if (!S.settings) return;
    var t = Number(getPath(S.settings, 'appearance.theme')) === 1 ? 1 : 0;
    applyTheme(t);
    store('mdTheme', String(t));
  });
  derived.push(function () { $('simChip').className = 'chip' + (S.settings && S.settings.simulation && S.settings.simulation.enabled ? ' on' : ''); });

  // Air Ride release on every way the hold can be lost.
  window.addEventListener('blur', holdStop);
  window.addEventListener('pagehide', holdStop);
  window.addEventListener('beforeunload', holdStop);
  window.addEventListener(HAS_POINTER ? 'pointerup' : 'touchend', function () { if (hold) holdStop(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) holdStop(); else airLoop(); });

  syncAll();
  var saved = store('mdPage');
  go(saved === 'climate' || saved === 'settings' ? saved : 'air');
  loadSettings();
  airLoop();
}
init();
</script>
</body>
</html>
